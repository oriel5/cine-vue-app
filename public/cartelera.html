<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cartelera - CineVue</title>
  <style>
    body { background: #121214; color: #fff; font-family: 'Segoe UI', Roboto, sans-serif; padding: 20px; margin: 0; }
    .cartelera-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
    .pelicula-card { background: #1e1e24; border: 1px solid #333; border-radius: 8px; overflow: hidden; position: relative; display: flex; flex-direction: column; }
    .badge { position: absolute; top: 10px; right: 10px; padding: 5px 10px; border-radius: 4px; font-size: 0.8em; font-weight: bold; }
    .badge-estreno { background: #e50914; }
    .badge-emision { background: #24b47e; }
    .poster-img { width: 100%; height: 350px; object-fit: cover; background: #18181c; }
    .card-body { padding: 15px; display: flex; flex-direction: column; flex-grow: 1; }
    .genero-tag { display: inline-block; background: #333; padding: 3px 10px; border-radius: 12px; font-size: 0.8em; }
    .encuesta-box { background: #2b2b36; padding: 12px; border-radius: 6px; text-align: center; border: 1px solid #444; margin-top: auto; }
    .btn-enc { padding: 7px 14px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin: 0 4px; }
    .btn-si { background: #24b47e; color: #fff; }
    .btn-no { background: #555; color: #fff; }
    .estrellas { color: #666; font-size: 1.7em; cursor: pointer; margin-top: 6px; }
    .estrellas span:hover { color: #ffcc00; }
  </style>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
    const supabase = createClient('TU_SUPABASE_URL_AQUI', 'TU_SUPABASE_ANON_KEY_AQUI')

    async function cargarCartelera() {
      const horaActual = new Date().toTimeString().split(' ')[0]
      const haceTresSemanas = new Date()
      haceTresSemanas.setDate(haceTresSemanas.getDate() - 21)
      const fechaFiltro = haceTresSemanas.toISOString().split('T')[0]

      const { data: funciones, error } = await supabase
        .from('funciones')
        .select('*, peliculas(*, puntuaciones(estrellas)), salas(*)')
        .gt('horario', horaActual)

      if (error || !funciones) return

      const funcionesProcesadas = funciones.map(f => {
        const votos = f.peliculas?.puntuaciones || []
        const suma = votos.reduce((acc, v) => acc + v.estrellas, 0)
        const promedio = votos.length > 0 ? parseFloat((suma / votos.length).toFixed(1)) : 0
        return {
          ...f,
          promedioCalificacion: promedio,
          esEstreno: f.peliculas?.fecha_estreno >= fechaFiltro
        }
      }).sort((a, b) => b.promedioCalificacion - a.promedioCalificacion)

      const contenedor = document.getElementById('cartelera')
      contenedor.innerHTML = ''

      funcionesProcesadas.forEach(f => {
        const estadoTexto = f.esEstreno ? 'Estreno' : 'En Emision'
        const estadoClass = f.esEstreno ? 'badge-estreno' : 'badge-emision'
        const estrellasTexto = f.promedioCalificacion > 0 ? `★ ${f.promedioCalificacion} / 5` : '★ Sin votos'
        const poster = f.peliculas?.poster_url || 'https://via.placeholder.com/300x400/1e1e24/ffffff?text=Sin+Portada'

        contenedor.innerHTML += `
          <div class="pelicula-card">
            <span class="badge ${estadoClass}">${estadoTexto}</span>
            <img src="${poster}" alt="${f.peliculas?.titulo}" class="poster-img">
            <div class="card-body">
              <h2 style="margin: 0 0 8px 0;">${f.peliculas?.titulo}</h2>
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <span class="genero-tag">${f.peliculas?.genero}</span>
                <span style="color:#ffcc00; font-weight:bold;">${estrellasTexto}</span>
              </div>
              <p style="font-size:0.9em; color:#aaa; margin:0 0 12px 0;">${f.peliculas?.descripcion || 'Sin descripción disponible.'}</p>
              <p style="font-size:0.85em; background:#16161a; padding:8px; border-radius:4px;"> ${f.salas?.nombre} |  <strong>${f.horario}</strong> (${f.idioma})</p>
              
              <div class="encuesta-box" id="encuesta-${f.id}">
                <p style="margin:0 0 8px 0; font-weight:bold;">¿Viste la película?</p>
                <button class="btn-enc btn-si" onclick="responderSi(${f.id}, ${f.peliculas?.id})">Sí, la vi</button>
                <button class="btn-enc btn-no" onclick="responderNo(${f.id})">Todavía no</button>
              </div>
            </div>
          </div>
        `
      })
    }

    window.responderSi = async (fId, pId) => {
      await supabase.from('vistas_peliculas').insert([{ pelicula_id: pId }])
      document.getElementById(`encuesta-${fId}`).innerHTML = `
        <p style="margin:0 0 4px 0; font-size:0.85em; color:#ccc;">¿Que nota le das del 1 al 5?</p>
        <div class="estrellas">
          <span onclick="votar(${fId}, ${pId}, 1)">★</span>
          <span onclick="votar(${fId}, ${pId}, 2)">★</span>
          <span onclick="votar(${fId}, ${pId}, 3)">★</span>
          <span onclick="votar(${fId}, ${pId}, 4)">★</span>
          <span onclick="votar(${fId}, ${pId}, 5)">★</span>
        </div>
      `
    }

    window.responderNo = (fId) => {
      document.getElementById(`encuesta-${fId}`).innerHTML = `
        <p style="color:#ffcc00; font-size:0.9em; margin:0;"> <strong>¡Te la recomiendo!</strong> No te la podes perder en cartelera!!!</p>
      `
    }

    window.votar = async (fId, pId, estrellas) => {
      await supabase.from('puntuaciones').insert([{ pelicula_id: pId, estrellas: estrellas }])
      document.getElementById(`encuesta-${fId}`).innerHTML = `
        <p style="color:#24b47e; font-weight:bold; font-size:0.9em; margin:0;"> ¡Gracias por puntuarnos con ${estrellas} estrellas!</p>
      `
      setTimeout(cargarCartelera, 1200)
    }

    supabase.channel('cambios').on('postgres_changes', { event: '*', filter: 'table=eq.funciones' }, cargarCartelera).subscribe()
    setInterval(cargarCartelera, 60000)
    window.onload = cargarCartelera
  </script>
</head>
<body>
  <h1>Cartelera - CineVue</h1>
  <div id="cartelera" class="cartelera-container"></div>
</body>
</html>
